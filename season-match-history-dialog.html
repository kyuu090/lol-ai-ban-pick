<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シーズン中の全試合データ取得</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/theme.css" />
  <link rel="stylesheet" href="./styles/season-match-history-dialog.css" />
</head>
<body>
  <main class="season-dialog" aria-labelledby="seasonDialogTitle">
    <div class="season-dialog-accent" aria-hidden="true"></div>
    <section class="season-dialog-panel">
      <div class="season-dialog-icon" aria-hidden="true">↓</div>
      <p class="season-dialog-eyebrow">MATCH DATA</p>
      <h1 id="seasonDialogTitle">シーズン中の全試合を取得</h1>
      <p class="season-dialog-description">今シーズンの試合データをまとめて取得し、BAN / PICK 分析のサンプル数を増やします。</p>
      <div class="season-dialog-estimate">
        <span>予想時間</span>
        <strong id="estimateText">--</strong>
      </div>
      <dl class="season-dialog-stats">
        <div><dt>対象試合</dt><dd id="totalMatches">0 試合</dd></div>
        <div><dt>未取得</dt><dd id="missingMatches">0 試合</dd></div>
      </dl>
      <p class="season-dialog-note">試合数によっては時間がかかります。取得中もアプリはそのまま利用できます。</p>
      <div class="season-dialog-actions">
        <button id="cancelButton" class="season-dialog-button secondary" type="button">キャンセル</button>
        <button id="confirmButton" class="season-dialog-button primary" type="button" autofocus>取得を開始</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const themeMode = params.get('themeMode');
      if (themeMode === 'light' || themeMode === 'dark') document.documentElement.dataset.theme = themeMode;
      document.querySelector('#estimateText').textContent = params.get('estimateText') || '--';
      document.querySelector('#totalMatches').textContent = `${params.get('totalMatches') || '0'} 試合`;
      document.querySelector('#missingMatches').textContent = `${params.get('missingMatches') || '0'} 試合`;
      const respond = (confirmed) => window.lcuApi.respondToSeasonMatchHistoryDialog(confirmed);
      document.querySelector('#confirmButton').addEventListener('click', () => respond(true));
      document.querySelector('#cancelButton').addEventListener('click', () => respond(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') respond(false);
      });
    })();
  </script>
</body>
</html>
